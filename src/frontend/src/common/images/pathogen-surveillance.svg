      <line x1="-8.5" y1="8.5" x2="-5.5" y2="5.5" stroke="#9b59b6" stroke-width="2"/>
      <line x1="8.5" y1="-8.5" x2="5.5" y2="-5.5" stroke="#9b59b6" stroke-width="2"/>
    </g>

    <!-- New dark blue virus -->
    <g class="virus" transform="translate(240,120) scale(0.95)">
      <circle r="8" fill="#34495e"/>
      <line x1="0" y1="-12" x2="0" y2="-8" stroke="#34495e" stroke-width="2"/>
      <line x1="0" y1="8" x2="0" y2="12" stroke="#34495e" stroke-width="2"/>
      <line x1="-12" y1="0" x2="-8" y2="0" stroke="#34495e" stroke-width="2"/>
      <line x1="8" y1="0" x2="12" y2="0" stroke="#34495e" stroke-width="2"/>
      <line x1="-8.5" y1="-8.5" x2="-5.5" y2="-5.5" stroke="#34495e" stroke-width="2"/>
      <line x1="8.5" y1="8.5" x2="5.5" y2="5.5" stroke="#34495e" stroke-width="2"/>
      <line x1="-8.5" y1="8.5" x2="-5.5" y2="5.5" stroke="#34495e" stroke-width="2"/>
      <line x1="8.5" y1="-8.5" x2="5.5" y2="-5.5" stroke="#34495e" stroke-width="2"/>
    </g>

    <!-- Center dot -->
    <circle cx="150" cy="150" r="3" fill="white"/>
  </g>
  
  <!-- Outer border -->
