<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#2173A6"/>
  <!-- Thanh Le Viet 26/10/2024-->
  <!-- Dendrogram tree - aligned branches with nodes -->
  <path 
    d="
      M200 340
      L200 250
      L120 250
      L120 180
      L80 180
      L80 110
      L60 110
      M80 110
      L100 110
      M120 180
      L160 180
      L160 110
      L140 110
      M160 110
      L180 110
      M200 250
      L280 250
      L280 180
      L240 180
      L240 110
      L220 110
      M240 110
      L260 110
      M280 180
      L320 180
      L320 110
      L300 110
      M320 110
      L340 110
    "
    stroke="white"
    stroke-width="5.5"
    fill="none"
  />
  
  <!-- Terminal nodes with strokes -->
  <g>
    <!-- Stroke circles (larger, behind) -->
    <circle cx="60" cy="110" r="7" stroke="white" stroke-width="2" fill="#e74c3c"/>
    <circle cx="100" cy="110" r="7" stroke="white" stroke-width="2" fill="#e74c3c"/>
    <circle cx="140" cy="110" r="7" stroke="white" stroke-width="2" fill="#dc903f"/>
    <circle cx="180" cy="110" r="7" stroke="white" stroke-width="2" fill="#dc903f"/>
    <circle cx="220" cy="110" r="7" stroke="white" stroke-width="2" fill="#9b59b6"/>
    <circle cx="260" cy="110" r="7" stroke="white" stroke-width="2" fill="#9b59b6"/>
    <circle cx="300" cy="110" r="7" stroke="white" stroke-width="2" fill="#34495e"/>
    <circle cx="340" cy="110" r="7" stroke="white" stroke-width="2" fill="#34495e"/>
  </g>
  
  <!-- Magnifying glass -->
  <g transform="translate(285,285) rotate(-45)">
    <!-- Handle -->
    <rect x="-4" y="25" width="8" height="35" fill="white"/>
    <!-- Glass -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="white" stroke-width="8"/>
    <!-- Reflection -->
    <path d="M-12 -12 L-7 -7" stroke="#2173A6" stroke-width="3"/>
  </g>
</svg>