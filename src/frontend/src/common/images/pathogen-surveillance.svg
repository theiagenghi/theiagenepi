      <line x1="-8.5" y1="8.5" x2="-5.5" y2="5.5" stroke="#9b59b6" stroke-width="2"/>
      <line x1="8.5" y1="-8.5" x2="5.5" y2="-5.5" stroke="#9b59b6" stroke-width="2"/>
