      <line x1="-8.5" y1="8.5" x2="-5.5" y2="5.5" stroke="#34495e" stroke-width="2"/>
      <line x1="8.5" y1="-8.5" x2="5.5" y2="-5.5" stroke="#34495e" stroke-width="2"/>
    </g>

    <g class="virus" transform="translate(160,220) scale(0.7)">
      <circle r="8" fill="#dc903f"/>
      <line x1="0" y1="-12" x2="0" y2="-8" stroke="#dc903f" stroke-width="2"/>
      <line x1="0" y1="8" x2="0" y2="12" stroke="#dc903f" stroke-width="2"/>
      <line x1="-12" y1="0" x2="-8" y2="0" stroke="#dc903f" stroke-width="2"/>
      <line x1="8" y1="0" x2="12" y2="0" stroke="#dc903f" stroke-width="2"/>
      <line x1="-8.5" y1="-8.5" x2="-5.5" y2="-5.5" stroke="#dc903f" stroke-width="2"/>
